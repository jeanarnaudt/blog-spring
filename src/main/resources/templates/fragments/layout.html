<!DOCTYPE html>
<html lang="en-US" xmlns:th="http://www.thymeleaf.org" th:fragment="common (title, content)" data-theme="light">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=1.0">
	<link rel="shortcut icon" href="/assets/favicon.png">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link
		href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Fira+Code:wght@300..700&display=swap"
		rel="stylesheet">
	<link rel="stylesheet" type="text/css" media="all" href="/css/output.css">
	<script th:src="@{/js/theme.js}"></script>
	<!--/*@thymesVar id="title" type=""*/-->
	<title th:replace="${title}">Layout Title</title>
</head>
<!--/*@thymesVar id="content" type=""*/-->
<body>
<header th:replace="~{fragments/header :: header (activePage)}"></header>

<main th:replace="${content}"></main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
