<!DOCTYPE html>
<html th:replace="~{fragments/layout :: common(~{::title}, ~{::body})}">
<head>
	<title>Blog :: My Articles</title>
</head>
<body>
<main>
	<h1 class="sr-only">Blog</h1>
	
	<section class="posts divide-y divide-base-300">
		<hgroup>
			<h2 class="heading-2 headline headline--section"><span>My Articles</span></h2>
			<p>Below are all my recent blog posts. Click on any title to read the full article.</p>
		</hgroup>
		<article th:each="post : ${posts}">
			<h3 class="heading-5"><a th:href="@{/blog/posts/{slug}(slug=${post.slug})}" th:text="${post.title}">...</a></h3>
			<p class="published_at"><time th:datetime="${post.publishedAt}" th:text="${#temporals.format(post.publishedAt, 'MMMM d, yyyy')}">...</time></p>
			<p th:text="${post.description}">...</p>
		</article>
	</section>
</main>
</body>
</html>
