<!DOCTYPE html>
<html th:replace="~{fragments/layout :: common(~{::title}, ~{::body})}" xmlns="http://www.w3.org/1999/html">
<head>
	<title th:text="${post.title}">Blog :: My Articles</title>
</head>
<body>
<main>
	<article class="post">
		<hgroup>
			<h1 th:text="${post.title}">Blog :: My Articles</h1>
			<p class="post-meta">Published
				<time th:datetime="${post.publishedAt}" th:text="${#temporals.format(post.publishedAt, 'MMMM d, yyyy')}"></time>
			</p>
		</hgroup>
		[(${post.content})]
	</article>
</main>
</body>
</html>
