<!DOCTYPE html>
<html th:replace="~{fragments/layout :: common(~{::title}, ~{::body})}" xmlns="http://www.w3.org/1999/html">
<head>
	<title th:text="${post.title}">Blog :: My Articles</title>
</head>
<body class="single">
<main>
	<article>
		<hgroup>
			<h1 th:text="${post.title}">...</h1>
			<p>Published
				<time th:datetime="${post.publishedAt}" th:text="${#temporals.format(post.publishedAt, 'MMMM d, yyyy')}">...
				</time>
			</p>
		</hgroup>
		<section th:utext="${post.content}"></section>
	</article>
</main>
</body>
</html>
